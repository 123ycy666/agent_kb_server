# ══════════════════════════════════════════════════════════════
#  企业级本地知识库系统 — Docker Compose
#
#  ⚠️ 显式指定项目名：目录名为中文时，compose 无法自动推导项目名，
#     会报 "project name must not be empty"。
#
#  仅包含基础设施（PostgreSQL），应用本身在本地开发运行。
#
#  ⚠️ 端口说明：本机 5432 已被本地 PostgreSQL 18 占用，
#     因此容器映射到 5433，避免冲突。
#  2026-10-15 单进程合并：只保留 PostgreSQL（Redis/Celery 已移除，
#  文档入库改 FastAPI BackgroundTasks）。
#
#  启动：docker compose up -d
#  停止：docker compose down
#  清空数据：docker compose down -v
# ══════════════════════════════════════════════════════════════

name: kb-system

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb_dev_pwd
      # ⚠️ 库名必须与 .env 的 DATABASE_URL 一致（应用连的是 ad_new）。
      #    这里原为 kb_system，与 .env 不符 ⇒ 全新部署会连不上库，2026-10-16 已改。
      POSTGRES_DB: ad_new
      # 中文排序与全文检索需要合适的 locale
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5433:5432"
    volumes:
      - kb_pgdata:/var/lib/postgresql/data
      # 初始化脚本：自动启用扩展
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d ad_new"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  kb_pgdata:
    name: kb_pgdata
