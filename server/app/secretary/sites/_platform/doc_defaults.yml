# 文档生成的默认格式（产品基线；站点可在自己目录放同名文件覆盖）
# 来源：原来是 server/app/secretary/docgen.py 顶部的常量，2026-10-21 挪到这里。
docx:
  body_font_cn: 仿宋_GB2312
  body_font_fallback: 仿宋
  title_font_cn: 方正小标宋简体
  body_pt: 16            # 三号
  title_pt: 22           # 二号
  line_spacing_pt: 28    # 固定值行距
  first_line_indent_chars: 2
  ai_note: 本文件由系统辅助生成，数据与结论请人工复核后使用。

xlsx:
  header_fill: DDEBF7
  border_color: BFBFBF
  freeze_header: true
  max_col_width: 60
  min_col_width: 10

pptx:
  slide_width_in: 13.333
  slide_height_in: 7.5
  font_cn: 微软雅黑
