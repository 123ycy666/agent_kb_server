# 站点配置：随州（第一期）
# 换单位 = 复制本目录改名 + 改这里的值；代码零改动。
name: 随州
full_name: 国网随州供电公司
code: suizhou

# 业务流程锚点（P3 会用：部门/角色/预警/派单）
dept:
  city_dept_id: 1            # 市级口径锚点（原 alert_scope.CITY_DEPT_ID，P3 迁入）
  city_label: 随州市供电所

# 启用的能力（P1 用：决定给哪些工具/流水线）
features:
  general: true              # 通用作答（写总结/翻译/解释）
  data: true                 # 查数
  doc: true                  # 文档流水线
  office: true               # 办公技能包（做 PPT / 写公文）

# 模型与预算
model:
  default: ""                # 空 = 用 .env 的 LOCAL_LLM_MODEL
  tool_budget: 12            # 一轮最多给几个工具（强模型可给到 15）

# 提示词覆盖层（默认关：真源是站点包文件，不是数据库）
prompt_db_override: false

# 注入哪些提示词 —— 在这里声明，代码不写死
prompts:
  # L3 业务口径：顺序即注入顺序（本系统从站点包 prompts/*.md 读）
  l3:
    - business_rules
    - caliber_rules
    - sql_plan_rules
    - work_order_rules
    - metrics_rules
    - answer_data
  # 旧链路（config.PROMPTS）仍从数据库注入时用的 key；P1 接线后只保留兼容
  db:
    - answer_agent
    - business_rules
    - sql_plan_rules
    - work_order_rules
    - caliber_rules

# 报告技能的默认值（原 report.py 里写死的"环潭供电所"）
report:
  default_station: 环潭供电所
