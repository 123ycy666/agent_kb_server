<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>项目管理秘书 · 模型自主问答演示</title>
<style>
 body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Microsoft YaHei',sans-serif;margin:0;background:#f5f5f5;color:rgba(0,0,0,.88)}
 header{padding:14px 20px;background:#fff;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:14px}
 h1{font-size:16px;margin:0;font-weight:600}
 select{padding:5px 8px;border:1px solid #d9d9d9;border-radius:5px;font-size:13px}
 .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;padding:16px 20px;align-items:start}
 .bar{display:flex;gap:8px}
 input{flex:1;padding:10px;font-size:15px;border:1px solid #d9d9d9;border-radius:6px;background:#fff}

#meta{font-size:12px;color:rgba(0,0,0,.45);margin-top:12px;border-top:1px solid #f0f0f0;padding-top:10px}

 .hint{font-size:12px;color:rgba(0,0,0,.45);margin-top:8px}
       .ok{color:#52c41a;font-weight:600}.bad{color:#ff4d4f;font-weight:600}
 .warnbox{background:#fffbe6;color:#d48806;border-radius:6px;padding:8px 10px;font-size:12.5px;line-height:1.6;margin-bottom:8px}
 .checks{margin-top:12px;border-top:1px solid #f0f0f0;padding-top:10px;font-size:12.5px;line-height:1.9}
 .checks .lbl{margin-bottom:6px}

/* ── 2026-10-15 视觉对齐 SPA（Ant Design 5）────────────────────
   本页原为自研浅色风格；为让「智能问答」融入统一平台（SPA 侧边栏 +
   Ant Design），把色板/字体/圆角对齐 Ant Design 5 默认 token：
   主色 #1677ff、文字 rgba(0,0,0,.88)/.45、边框 #f0f0f0/#d9d9d9。
   以下为交互态补强。 */
body{-webkit-font-smoothing:antialiased}
input:focus,select:focus{border-color:#1677ff;outline:0;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
button:hover:not(:disabled){background:#4096ff}
button:active:not(:disabled){background:#0958d9}
.card{box-shadow:0 1px 2px 0 rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px 0 rgba(0,0,0,.02)}
/* 检索知识库的复选框：原样式给 input 设了 flex:1 / padding:10px，
   会把小方框撑成一条长条，这里显式覆盖。 */
#kbpick label{display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;color:rgba(0,0,0,.88)}
#kbpick input[type=checkbox]{flex:none;width:14px;height:14px;padding:0;margin:0;border-radius:3px}
#answer,#meta,#completed{display:none}
.ops{margin-top:6px;font-size:12px;display:flex;gap:12px}
.ops a{color:#8a95a1;text-decoration:none}
.ops a:hover{color:#1677ff}
.stopbtn{padding:9px 14px;border:1px solid #e6e9ee;border-radius:12px;background:#fff;color:#3b4653;cursor:pointer;font-size:14px}
</style>
<script>
/* ★ 2026-11-08：?token= 必须**最先**写进 localStorage —— 页面里的 loadModels/loadKbs/
   loadPresets 一加载就发请求，没令牌会 401，fetch 包装器直接把页面踹到 /login（SPA），
   表现就是「打开页面没法问话」。 */
try{
  var _qt=new URLSearchParams(location.search).get('token');
  if(_qt){localStorage.setItem('kb_token',_qt);history.replaceState(null,'',location.pathname);}
}catch(e){}
// 2026-10-15 单进程合并：统一用户表后问答接口需要 JWT。
// 这里全局包装 fetch：自动带 Authorization；401 回登录页。
(function(){
  var _fetch = window.fetch;
  window.fetch = function(input, init){
    init = init || {};
    if(!init.headers) init.headers = {};
    try{
      var t = localStorage.getItem('kb_token');
      if(t && !init.headers['Authorization']) init.headers['Authorization'] = 'Bearer ' + t;
    }catch(e){}
    return _fetch(input, init).then(function(r){
      if(r.status === 401 && location.pathname.indexOf('/login') < 0){
        location.href = '/login?from=' + encodeURIComponent(location.pathname);
      }
      return r;
    });
  };
})();
</script>

      .composer .icon{padding:9px 11px;border:1px solid #e6e9ee;border-radius:12px;background:#f7f8fa;cursor:pointer}

<body>
<div class="app">
  <aside class="side">

<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var MODELNOTE={};
function loadModels(){
  fetch('/api/models').then(function(r){return r.json();}).then(function(d){
    var sel=document.getElementById('model'), groups={}, order=[];
    (d.models||[]).forEach(function(m){
      if(!groups[m.group]){groups[m.group]=[];order.push(m.group);}
      groups[m.group].push(m); MODELNOTE[m.id]=m.note||'';
    });
    order.forEach(function(g){
      var og=document.createElement('optgroup'); og.label=g;
      groups[g].forEach(function(m){
        var op=document.createElement('option'); op.value=m.id;
        op.textContent=m.label+'  ('+m.id+')';
        og.appendChild(op);
      });
      sel.appendChild(og);
    });
    sel.value=d.default||'deepseek-v4.1-flash-1017';
    document.getElementById('modelnote').textContent=MODELNOTE[sel.value]||'';
  }).catch(function(){});
}
document.getElementById('model').addEventListener('change',function(){
  document.getElementById('modelnote').textContent=MODELNOTE[this.value]||'';
});
loadModels();

/* ---------------- 检索知识库（2026-10-15 新增） ----------------
   勾选本次提问要查哪些库。默认勾选 = 库里 qa_enabled=true 的库
   （该标记在「知识库」页维护）。
   ⚠️ 默认值不用 id 写死：自增 id 会因删库/建库漂移（删了不复用、
      新建拿更大值），而标记随库走，删库自动移出、建库勾一下即可。 */
function loadKbs(){
  fetch('/api/v1/kb').then(function(r){return r.json();}).then(function(d){
    var items=(d&&d.items)||[];
    var box=document.getElementById('kbpick');
    var hint=document.getElementById('kbhint');
    if(!items.length){hint.textContent='（暂无知识库）';return;}
    box.innerHTML=items.map(function(k){
      return '<label><input type="checkbox" value="'+k.id+'"'+(k.qa_enabled?' checked':'')+'>'+esc(k.name)+'</label>';
    }).join('');
    box.addEventListener('change',updateKbHint);
    updateKbHint();
  }).catch(function(){
    document.getElementById('kbhint').textContent='（知识库列表加载失败）';
  });
}
function pickedKbIds(){
  return Array.prototype.slice.call(document.querySelectorAll('#kbpick input:checked'))
    .map(function(x){return parseInt(x.value,10);})
    .filter(function(n){return !isNaN(n);});
}
function updateKbHint(){
  var all=document.querySelectorAll('#kbpick input').length;
  var n=pickedKbIds().length;
  document.getElementById('kbhint').textContent =
    n===0 ? '⚠️ 未勾选任何库：将按系统默认范围检索' : ('已选 '+n+' / '+all+' 个');
}
loadKbs();
/* loadPresets(); —— 2026-11-12 Fred：预设问题区块先隐藏，连请求也不发 */
setSession(getSession());

/* ---------------- 预设问题（2026-10-20 新增） ----------------
   空输入框最劝退：新用户不知道该问什么、能写成什么样。给一批真实示例，
   点一下直接发问。清单在服务端 presets.py（约定见那里的注释）。 */
function loadPresets(){
  var box=document.getElementById('presets');
  if(!box)return;
  fetch('/api/presets').then(function(r){return r.json();}).then(function(d){
    var items=(d&&d.items)||[];
    if(!items.length)return;
    var groups={},order=[];
    items.forEach(function(p){
      if(!groups[p.group]){groups[p.group]=[];order.push(p.group);}
      groups[p.group].push(p);
    });
    var h='<div style="font-size:12px;color:#8a95a1;margin-bottom:6px">试试这些（点一下就问）：</div>';
    order.forEach(function(g){
      h+='<div style="margin-bottom:7px"><span style="font-size:12px;color:#5b6673;margin-right:8px">'+esc(g)+'</span>';
      groups[g].forEach(function(p){
        h+='<button class="preset" data-q="'+esc(p.text)+'" onclick="usePreset(this)" '
          +'style="margin:0 6px 6px 0;padding:4px 9px;font-size:12px;cursor:pointer;'
          +'background:#f4f7ff;color:#2d5bb9;border:1px solid #dbe6ff;border-radius:12px">'
          +esc(p.text)+'</button>';
      });
      h+='</div>';
    });
    box.innerHTML=h;
  }).catch(function(){});
}
function usePreset(btn){
  document.getElementById('q').value=btn.getAttribute('data-q')||'';
  ask();
}
function tagCls(t){
  if(t==='kb_search'||t==='kb_read'||t==='read_file')return 't-kb';
  if(t==='run_sql'||t==='describe_table'||t==='find_column')return 't-db';
  if(t==='answer'||t==='make_file'||t==='run_code')return 't-ans';
  return 't-meta';
}

/* ---------------- 会话（多轮记忆） ----------------
   服务端靠 session_id 记住同一场会话，并把它作为上下文交给模型。
   页面把它存在 localStorage：刷新浏览器也不丢；点「新会话」才重新开始。 */
function getSession(){
  var s=null;
  try{s=localStorage.getItem('secretary_session');}catch(e){}
  return s||'';
}
function setSession(s){
  try{localStorage.setItem('secretary_session',s||'');}catch(e){}
  var el=document.getElementById('sessbar');
  if(el){el.textContent=s?('当前会话：'+s+'（同一场会话里，本轮没说的时间和地点会沿用上一轮）'):'未开始会话，下次提问会自动新建一场';}
}
function newSession(){
  setSession('');
  SESSFILES=[]; renderSessFiles();
  var _c=document.getElementById('conv'); if(_c)_c.innerHTML='';
  var _t=document.getElementById('trace'); if(_t)_t.innerHTML='';
  document.getElementById('answer').textContent='';
  document.getElementById('completed').textContent='';
  document.getElementById('meta').textContent='';
  document.getElementById('trace').innerHTML='';
  document.getElementById('q').value='';
  document.getElementById('q').focus();
}

/* ---------------- 上传文件 / 文档任务（2026-10-19 加） ----------------
   问答：把 file_id 放进 /api/ask 的 file_ids，后端按问题取全文或节选章节；
   任务：速读 / 审校 / 查表走 /api/docs/jobs，轮询进度，完成后给下载。
   下载不能用 <a href>：鉴权是 Authorization 头（JWT 在 localStorage），
   裸链接不会带 header ⇒ 401。所以统一走 fetch → blob → 触发保存。 */
function renderAnswer(txt){
  var lines=String(txt||'').split(/\r?\n/), out='', list=false;
  lines.forEach(function(l){
    var m=l.match(/^\s*(\d+)[.、)]\s*(.*)$/);
    if(m){
      if(!list){out+='<ol style="margin:6px 0 6px 20px;padding:0">';list=true;}
      out+='<li>'+esc(m[2])+'</li>';return;
    }
    if(list){out+='</ol>';list=false;}
    if(l.trim())out+='<p style="margin:6px 0">'+esc(l)+'</p>';
  });
  if(list)out+='</ol>';
  return out||esc(txt||'');
}
var DOCFILES=[];
function fileKind(name){
  var e=(name||'').split('.').pop().toLowerCase();
  if(['xlsx','xls','xlsm','csv'].indexOf(e)>=0)return '表格';
  if(e==='pdf')return 'PDF';
  if(e==='pptx'||e==='pptm')return 'PPT';
  return '文档';
}
function renderFiles(){
  var el=document.getElementById('filetip');
  if(!DOCFILES.length){el.innerHTML='';return;}
  el.innerHTML=DOCFILES.map(function(f,i){
    var p=f.parsed||{};
    var st=p.ok?('已解析 '+p.chars+' 字'):('未解析：'+(p.error||'未知'));
    return '<span style="display:inline-block;margin:2px 6px 2px 0;padding:3px 8px;border:1px solid #d6e4f0;border-radius:10px;background:#f4f9ff">'
      +'<b>'+esc(f.name)+'</b> <span style="color:#5b7fa6">'+fileKind(f.name)+'</span> '
      +esc(st)+' <a href="javascript:void(0)" onclick="delFile('+i+')" style="color:#a12a20">×</a></span>';
  }).join('');
}
function delFile(i){DOCFILES.splice(i,1);renderFiles();}
function uploadDoc(inp){
  var f=inp.files&&inp.files[0]; inp.value='';
  if(!f)return;
  var tip=document.getElementById('filetip');
  tip.textContent='正在上传并解析：'+f.name+' …';
  var fd=new FormData(); fd.append('file',f);
  fetch('/api/files',{method:'POST',body:fd})
   .then(function(r){return r.json();})
     .then(function(d){
       if(d && d.file_id){
         DOCFILES.push(d); renderFiles();
         /* 2026-11-12：上传的文件同时记进本会话附件，下一轮说「这个文章」时能自动带上。
            原来只进 DOCFILES，发送后就被清空，等于每个文件只能在这一轮用一次。 */
         if(!SESSFILES.some(function(x){return x.file_id===d.file_id;})) SESSFILES.push(d);
         renderSessFiles();
       }
       else { tip.textContent='上传失败：'+((d&&d.detail&&d.detail.message)||JSON.stringify(d)); }
     })
   .catch(function(e){tip.textContent='上传失败：'+e;});
}
function saveBlob(url,name){
  fetch(url).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.blob();
  }).then(function(b){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=name||'download';
    document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
  }).catch(function(e){alert('下载失败：'+e);});
}
/* ---------------- 对话渲染 ---------------- */
function attsHtml(atts){
  var h='';
  (atts||[]).forEach(function(a){
    if(!a||!a.name)return;
    h+='<div style="display:inline-block;margin:6px 6px 0 0;padding:4px 8px;border:1px solid #d6e4f0;border-radius:8px;background:#f4f9ff;font-size:12px">'
      +'📎 <b>'+esc(a.name)+'</b>'
      +(a.bytes?(' · '+Math.round(a.bytes/1024)+' KB'):'')
      +(a.file_id?(' · <a href="javascript:void(0)" onclick="saveBlob(\'/api/files/'+esc(a.file_id)+'/download\',\''+esc(a.name)+'\')">下载</a>'):'')
      +'</div>';
  });
  return h;
}
function appendTurn(q, answerHtml, metaHtml, atts){
  var el=document.getElementById('conv');
  var div=document.createElement('div');
  var u=document.createElement('div'); u.className='msg-u';
  u.innerHTML='<div>'+esc(q)+'</div>'+attsHtml(atts);
  var a=document.createElement('div'); a.className='msg-a';
  a.innerHTML='<div class="conv-a">'+(answerHtml||'<span class="hint">处理中…</span>')+'</div>'
             +(metaHtml?('<div class="conv-m meta">'+metaHtml+'</div>'):'')
             +'<div class="ops"><a href="javascript:void(0)" onclick="copyAnswer(this)">复制</a>'
             +'<a href="javascript:void(0)" onclick="retryAsk(this)">重试</a></div>';
  div.appendChild(u); div.appendChild(a);
  el.appendChild(div);
  div.scrollIntoView&&div.scrollIntoView({block:'end'});
  return div;
}
function stepLine(s){
  var name=(s.kind==='tool'||s.tool)?(s.tool||s.kind):(s.kind||'');
  var sum='';
  var r=s.result||{};
  var args='';
  try{args=(s.args&&Object.keys(s.args).length)?JSON.stringify(s.args):'';}catch(e){args='';}
  if(s.kind==='route')sum='分线='+(r.lane||'')+' 产物='+(r.product||'')
    +((r.howto)?(' 做法='+r.howto):'')+((r.why)?(' ｜ '+r.why):'')
    +((r.need&&r.need.length)?(' ｜ 需要='+r.need.join(',')):'');
  else if(s.kind==='plan')sum=(r['做法']||'')+((r['产物'])?(' → '+r['产物']):'')
    +((r['步骤']&&r['步骤'].length)?(' ｜ '+r['步骤'].join(' → ')):'');
  else if(r.error)sum='错误：'+r.error;
  else if(s.kind==='intent')sum='查库='+(r.use_db?'是':'否')+' 读文件='+(r.use_file?'是':'否')+' 出文件='+(r.make_file?'是':'否')+(r.reason?(' ｜ '+r.reason):'');
  else if(s.kind==='namefix')sum=(r.used?('改成：'+r.fixed):'没改')+(r.names&&r.names.length?(' ｜ 名称：'+r.names.join('/')):'');
  else if(s.kind==='complete')sum=(r.text||'');
  else if(s.kind==='confirm')sum=(r.text||'');
  else if(s.kind==='system')sum=r.chars+' 字'+(r.has_caliber?'（带查数口径）':'');
  else if(s.kind==='tools')sum='给的工具：'+((r.tools||[]).join(' '));
  else if(s.kind==='progress')sum=(s.content||'');
  else if(s.kind==='nudge'||s.kind==='budget')sum=(s.content||'');
  else if(r.multi)sum=r.count+' 条 SQL 并发';
  else if(r.rows)sum=r.rows.length+' 行';
  else if(r.name&&r.url)sum=r.name+' '+(r.bytes||0)+' B 自检='+((r.self_check||{}).verdict||'-');
  else if(r.blocks)sum=r.blocks.length+' 块，next='+r.next_offset;
  else if(r.chunks)sum=r.chunks.length+' 块，next='+r.next_offset;
  else if(r.nodes)sum=r.nodes.length+' 条切片';
  else if(typeof s.content==='string')sum=s.content;
  if(!sum&&args)sum='参数：'+args;
  return '<span class="tag '+tagCls(s.tool||s.kind)+'">'+esc(name||'-')+'</span> '
       +'<span style="color:#5b6b7c">'+esc(String(sum||'').slice(0,220))+'</span>'
       +(s.ms?('<span class="ms">'+s.ms+' ms</span>'):'');
}
function stepDetail(s){
  var o={kind:s.kind,tool:s.tool,round:s.round,ms:s.ms};
  if(s.args!==undefined)o.args=s.args;
  if(s.result!==undefined)o.result=s.result;
  if(s.content!==undefined)o.content=s.content;
  try{return JSON.stringify(o,null,1);}catch(e){return String(s.result||s.content||'');}
}
function renderSteps(steps){
  var h='';
  (steps||[]).forEach(function(s){
    h+='<details class="step"><summary>'+stepLine(s)+'</summary>'
      +'<div class="stepraw">'+esc(stepDetail(s).slice(0,6000))+'</div></details>';
  });
  document.getElementById('trace').innerHTML=h||'<span class="hint">等待第一步…</span>';
}
var SESSFILES=[];   /* 这场会话里用过的文件：续问时自动带上，不然模型看不见它们 */
function sessFilesHtml(){
  if(!SESSFILES.length)return '';
  var h='本会话附件：';
  SESSFILES.forEach(function(a){
    h+='<span style="display:inline-block;margin:0 6px 0 0;padding:2px 8px;border:1px solid #d6e4f0;border-radius:10px;background:#f4f9ff">'
      +'📎 '+esc(a.name)
      +' <a href="javascript:void(0)" onclick="saveBlob(\'/api/files/'+esc(a.file_id)+'/download\',\''+esc(a.name)+'\')" style="color:#1677ff">下载</a>'
      +' <a href="javascript:void(0)" onclick="dropSessFile(\''+esc(a.file_id)+'\')" style="color:#a12a20">×</a></span>';
  });
  return h;
}
function renderSessFiles(){
  var el=document.getElementById('sessfiles');
  if(el)el.innerHTML=sessFilesHtml();
}
function dropSessFile(fid){
  SESSFILES=SESSFILES.filter(function(a){return a.file_id!==fid;});
  renderSessFiles();
}
function readFilesFromSteps(steps){
  var out=[], seen={};
  (steps||[]).forEach(function(s){
    if((s.tool||s.tool_name)!=='read_file')return;
    var o=s.result;
    if(!o&&s.output_text){ try{o=JSON.parse(s.output_text);}catch(e){o=null;} }
    if(!o||!o.file_id||seen[o.file_id])return;
    seen[o.file_id]=1;
    out.push({name:o.name||o.file_id, file_id:o.file_id, bytes:0});
  });
  return out;
}
function artFromSteps(steps){
  var out=[];
  (steps||[]).forEach(function(s){
    var tool=s.tool||s.tool_name;
    if(tool!=='make_file'&&tool!=='run_code')return;
    var o=s.result;
    if(!o&&s.output_text){ try{o=JSON.parse(s.output_text);}catch(e){o=null;} }
    if(!o)return;
    if(o.url&&o.name){
      out.push({name:o.name,bytes:o.bytes,url:o.url,
                self_check:((o.self_check||{}).verdict)||'未自检'});
    }
    (o.outputs||[]).forEach(function(x){
      if(x.url)out.push({name:x.name,bytes:0,url:x.url,self_check:'未自检'});
    });
  });
  return out;
}
function planHtml(d){
  var p=(d&&d.plan)||{};
  if(!p['做法'])return '';
  var steps=(p['步骤']||[]).join(' → ');
  return '<div style="margin-bottom:10px;padding:8px 10px;border-left:3px solid #1677ff;'
    +'background:#f5f9ff;border-radius:6px;font-size:13px">'
    +'<b>按《'+esc(p['做法'])+'》做</b>'
    +(p['产物']?(' · 产物 '+esc(p['产物'])):'')
    +(steps?('<div style="color:#7a869a;font-size:12px;margin-top:2px">'+esc(steps)+'</div>'):'')
    +'</div>';
}
function artHtml(arts){
  var h='';
  (arts||[]).forEach(function(r){
    h+='<div style="margin-top:8px;padding:8px 10px;border:1px solid #cfe3d6;border-radius:8px;background:#f6fdf8">'
      +'<b>'+esc(r.name)+'</b> · '+(Math.round((r.bytes||0)/1024))+' KB · 自检 '
      +esc(r.self_check||'-')+' · '
      +'<a href="javascript:void(0)" onclick="saveBlob(\''+r.url+'\',\''+esc(r.name)+'\')">下载</a></div>';
  });
  return h;
}
function loadMyFiles(){
  fetch('/api/files?page_size=100').then(function(r){return r.json();}).then(function(d){
    var el=document.getElementById('filelist'); if(!el)return;
    var rows=d.items||[];
    el.innerHTML=rows.length?rows.map(function(f){
      return '<div class="item">'
        +'<span class="t" title="'+esc(f.name)+'">'+esc(f.name)+'</span>'
        +'<span class="hint">'+(Math.round((f.size||0)/1024))+' KB</span>'
        +'<a href="javascript:void(0)" onclick="saveBlob(\'/api/files/'+esc(f.file_id)+'/download\',\''+esc(f.name)+'\')" style="color:#1677ff;font-size:11px">下载</a>'
        +'</div>';
    }).join(''):'<span class="hint">还没有文件（上传的、做出来的都会在这里）。</span>';
    var hint=document.getElementById('filehint');
    if(hint)hint.textContent='共 '+(d.total||rows.length)+' 个'+(rows.length<((d.total)||0)?('，列最近 '+rows.length+' 个'):'');
  }).catch(function(){});
}
function renderResult(d){
  if(!d)return;
  if(d.session_id)setSession(d.session_id);
  document.getElementById('completed').textContent=(d.user_profile?('用户画像：'+d.user_profile+String.fromCharCode(10)):'')+(d.completed_question?('补全参考（仅参考，以问题为准）：'+d.completed_question):'');
  var _arts=(d.artifacts&&d.artifacts.length)?d.artifacts:artFromSteps(d.trace||[]);
  var _ph=artHtml(_arts), _pl=planHtml(d);
  loadMyFiles();
  document.getElementById('answer').innerHTML=_pl+renderAnswer(d.answer||'（空）')+_ph;
  var w=d.no_db_query?'<span class="warn">本次未查询数据库</span>':'';
  var tm=d.timings||{};
  var gap=d.recorded_as_gap?'<span class="warn" style="background:#fff1f0;color:#a12a20">已记入缺口清单</span>':'';
  var meta='模型 '+esc(d.model||'')+' · 工具调用 '+(d.steps||0)+' 次（查库 '
     +(d.db_query_count||0)+' 次 / 知识库 '+(d.kb_query_count||0)+' 次）· 总耗时 '+(((d.elapsed_ms||0))/1000).toFixed(1)+' 秒'
     +w+gap;
  document.getElementById('meta').innerHTML=meta;
  var body=_pl+renderAnswer(d.answer||'（空）')+_ph;
  if(CUR){
    var a=CUR.querySelector('.conv-a'); if(a)a.innerHTML=body;
    var m=CUR.querySelector('.conv-m'); if(m)m.innerHTML=meta;
    CUR=null;
  }else{
    appendTurn(document.getElementById('q').value.trim()||'（本轮）', body, meta);
  }
}
var CUR=null;
var TID=null, TIMER=null;
function stopGen(){
  if(TID){
    fetch('/api/ask/stop?task_id='+encodeURIComponent(TID),{method:'POST'}).catch(function(){});
  }
  if(TIMER){clearInterval(TIMER);TIMER=null;}
  var b=document.getElementById('stop'); if(b)b.style.display='none';
  if(CUR){var a=CUR.querySelector('.conv-a'); if(a){var cur=a.innerText;
    a.innerHTML=esc(cur&&cur.indexOf('模型在处理')<0?cur:'（已停止生成）');}
    var m=CUR.querySelector('.conv-m'); if(m)m.innerHTML='已停止';}
  CUR=null;
}
function askStream(q, model, profile, snapi){
  var base=(snapi&&snapi.length)?snapi:DOCFILES;
  var ids=[], seen={};
  base.concat(SESSFILES).forEach(function(f){
    if(!f||!f.file_id||seen[f.file_id])return;
    seen[f.file_id]=1; ids.push(f.file_id);
  });
  fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question:q,model:model,profile:profile,
                             kb_ids:pickedKbIds(),
                             file_ids:ids,
                             session_id:getSession()||undefined,
                             stream:true})})
   .then(function(r){return r.json();})
   .then(function(d){
     if(d.session_id)setSession(d.session_id);
     if(!d.task_id){renderResult(d);return;}
     TID=d.task_id;
     document.getElementById('stop').style.display='';
     var timer=TIMER=setInterval(function(){
       fetch('/api/ask/progress?task_id='+encodeURIComponent(d.task_id))
        .then(function(r){return r.json();})
        .then(function(p){
          renderSteps(p.steps||[]);
          if(p.done){
            clearInterval(timer); TIMER=null; TID=null;
            document.getElementById('stop').style.display='none';
            renderResult(p.result||{});
            loadSessions();
          }
        }).catch(function(){});
     },700);
   })
   .catch(function(e){document.getElementById('answer').textContent='请求失败：'+e;});
}
function ask(){
  var q=document.getElementById('q').value.trim();
  if(!q)return;
  var b=document.getElementById('go');b.disabled=true;b.textContent='生成中…';
  document.getElementById('answer').innerHTML='<span class="hint">模型在处理，右边是实时运行步骤…</span>';
  document.getElementById('completed').textContent='';
  document.getElementById('trace').innerHTML='';
  document.getElementById('meta').textContent='';
  var model=document.getElementById('model').value;
  var profile=document.getElementById('profile').value.trim();
  try{localStorage.setItem('secretary_profile',profile);}catch(e){}
  /* ★ 先拍快照再清空：原来清空后才把 DOCFILES 传给 askStream，等于什么都没发出去
     （实测模型回「附件和文件都没有传过来」）。 */
  var snapshot=DOCFILES.slice();
  CUR=appendTurn(q, '<span class="hint">模型在处理，右边是实时运行步骤…</span>', '', snapshot);
  document.getElementById('q').value='';
  DOCFILES=[]; renderFiles();
  askStream(q, model, profile, snapshot);
  setTimeout(function(){b.disabled=false;b.textContent='发送';}, 800);
}

/* ---------------- 历史会话 ---------------- */
function ensureToken(){
  var t=null; try{t=localStorage.getItem('kb_token');}catch(e){}
  if(t)return true;
  var el=document.getElementById('tokbar');
  if(el)el.style.display='flex';
  return false;
}
function saveToken(){
  var v=document.getElementById('tokin').value.trim();
  if(!v)return;
  try{localStorage.setItem('kb_token',v);}catch(e){}
  document.getElementById('tokbar').style.display='none';
  loadSessions();
}
function delSession(sid, ev){
  if(ev)ev.stopPropagation();
  if(!confirm('删除这场会话？删了就看不到它的历史了'))return;
  fetch('/api/sessions/'+encodeURIComponent(sid)+'/delete',{method:'POST'})
   .then(function(r){return r.json();})
   .then(function(d){
     if(d.ok){ if(getSession()===sid)newSession(); loadSessions(); }
     else{alert(d.error||'删除失败');}
   }).catch(function(e){alert('删除失败：'+e);});
}
function loadSessions(){
  if(!ensureToken())return;
  fetch('/api/sessions').then(function(r){return r.json();}).then(function(d){
    SESSROWS=d.sessions||[];
    var hint=document.getElementById('sesshint');
    if(hint)hint.textContent='共 '+(d.total||SESSROWS.length)+' 场';
    renderSessList();
  }).catch(function(){});
}
function renderSessList(){
  var el=document.getElementById('sesslist'); if(!el)return;
  var kw=(document.getElementById('sessfind')||{}).value||'';
  kw=kw.trim();
  var rows=SESSROWS.filter(function(s){
    if(!kw)return true;
    return String((s.title||'')+(s.last_question||'')).indexOf(kw)>=0;
  });
  el.innerHTML=rows.length?rows.map(function(s){
    var sid=esc(s.session_id||'');
    var t=s.title||s.last_question||'(无标题)';
    var when=s.last_msg_at||s.create_time||'';
    return '<div class="item'+(getSession()===s.session_id?' cur':'')+'" onclick="openSession(\''+sid+'\')">'
      +'<span class="t">'+esc(String(t).slice(0,40))+'</span>'
      +'<span class="hint">'+esc(String(when).slice(5,16))+'</span>'
      +'<a href="javascript:void(0)" onclick="delSession(\''+sid+'\',event)" style="color:#a12a20;font-size:11px">删</a>'
      +'</div>';
  }).join(''):'<span class="hint">没有匹配的会话。</span>';
}
var SESSROWS=[];
function copyAnswer(el){
  var box=el.closest('.msg-a');
  var txt=box&&box.querySelector('.conv-a')?box.querySelector('.conv-a').innerText:'';
  navigator.clipboard.writeText(txt).then(function(){
    el.textContent='已复制'; setTimeout(function(){el.textContent='复制';},1200);
  },function(){alert('复制失败，请手动选中');});
}
function retryAsk(el){
  var wrap=el.closest('.msg-a').previousElementSibling;
  var q=wrap?wrap.innerText.split('📎')[0].trim():'';
  if(!q)return;
  document.getElementById('q').value=q;
  ask();
}
function openSession(sid){
  setSession(sid);
  fetch('/api/history?session_id='+encodeURIComponent(sid)+'&with_steps=1').then(function(r){return r.json();}).then(function(d){
    var el=document.getElementById('conv'); el.innerHTML='';
    var msgs=(d.messages)||[];
    var pendingQ='';
    msgs.forEach(function(m){
      var dir=m.direction||m.sender_type||'';
      var isUser=(dir==='in'||dir==='user');
      if(isUser){ pendingQ=m.content||''; }
      else{
        /* 附件挂在用户气泡上：从这条回答的步骤里捞 read_file 的 file_id */
        appendTurn(pendingQ, renderAnswer(m.content||'')+artHtml(artFromSteps(m.steps)),
                   '模型 '+esc(m.model||'')+' · 工具调用 '+(m.steps||0)+' 步',
                   readFilesFromSteps(m.steps));
        pendingQ='';
      }
    });
    SESSFILES=[];
    msgs.forEach(function(m){ readFilesFromSteps(m.steps).forEach(function(a){
      if(!SESSFILES.some(function(x){return x.file_id===a.file_id;}))SESSFILES.push(a);
    });});
    renderSessFiles();
    document.getElementById('sessbar').textContent='已载入 '+msgs.length+' 条消息 · 会话 '+sid+'（接着问就续在这场里，附件自动带上）';
    document.getElementById('answer').innerHTML='';
    document.getElementById('meta').textContent='';
    document.getElementById('trace').innerHTML='<span class="hint">继续提问，这里会显示新的运行步骤。</span>';
  }).catch(function(e){
    document.getElementById('sessbar').textContent='载入失败：'+e;
  });
}

document.getElementById('q').addEventListener('keydown',function(e){
