<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>项目管理秘书 · 模型自主问答演示</title>
<style>
 body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Microsoft YaHei',sans-serif;margin:0;background:#f5f5f5;color:rgba(0,0,0,.88)}
 header{padding:14px 20px;background:#fff;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:14px}
 h1{font-size:16px;margin:0;font-weight:600}
 select{padding:5px 8px;border:1px solid #d9d9d9;border-radius:5px;font-size:13px}
 .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;padding:16px 20px;align-items:start}
 .bar{display:flex;gap:8px}
 input{flex:1;padding:10px;font-size:15px;border:1px solid #d9d9d9;border-radius:6px;background:#fff}
 button{padding:10px 18px;font-size:15px;border:0;border-radius:6px;background:#1677ff;color:#fff;cursor:pointer}
 button:disabled{background:#91caff}
 .card{background:#fff;border:1px solid #f0f0f0;border-radius:8px;padding:14px}
 .lbl{font-size:12px;color:rgba(0,0,0,.45);margin:0 0 8px}
 #answer{white-space:pre-wrap;line-height:1.65;min-height:80px;font-size:15px}
 #completed{font-size:12.5px;color:#5b3fd0;background:#f9f0ff;border-left:3px solid #722ed1;border-radius:4px;padding:7px 10px;margin-bottom:10px;line-height:1.6;white-space:pre-wrap}
#meta{font-size:12px;color:rgba(0,0,0,.45);margin-top:12px;border-top:1px solid #f0f0f0;padding-top:10px}
 .warn{display:inline-block;background:#fffbe6;color:#d48806;border-radius:4px;padding:2px 8px;font-size:12px;margin-left:8px}
 .step{border:1px solid #f0f0f0;border-radius:6px;margin:0 0 8px;overflow:hidden}
 .step summary{cursor:pointer;padding:8px 10px;font-size:13px;background:#fafafa;list-style:none}
 .step summary::-webkit-details-marker{display:none}
 .tag{display:inline-block;padding:1px 7px;border-radius:3px;font-size:12px;margin-right:8px;color:#fff}
 .t-kb{background:#722ed1}.t-db{background:#1677ff}.t-meta{background:#8a94a0}.t-ans{background:#52c41a}
 .ms{float:right;color:rgba(0,0,0,.45);font-size:12px}
 pre{margin:0;padding:10px;font-size:12px;overflow:auto;max-height:300px;background:#fff;border-top:1px solid #f0f0f0;white-space:pre-wrap;word-break:break-all}
 .hint{font-size:12px;color:rgba(0,0,0,.45);margin-top:8px}
 #report{line-height:1.75;font-size:14.5px}
 #report h3{font-size:15px;margin:16px 0 8px;padding-left:8px;border-left:3px solid #1677ff}
 #report h4{font-size:14px;margin:12px 0 6px}
 #report ul,#report ol{margin:6px 0 10px;padding-left:22px}
 #report p{margin:6px 0}
 #report b{color:#123a6b}
 .ok{color:#52c41a;font-weight:600}.bad{color:#ff4d4f;font-weight:600}
 .warnbox{background:#fffbe6;color:#d48806;border-radius:6px;padding:8px 10px;font-size:12.5px;line-height:1.6;margin-bottom:8px}
 .checks{margin-top:12px;border-top:1px solid #f0f0f0;padding-top:10px;font-size:12.5px;line-height:1.9}
 .checks .lbl{margin-bottom:6px}

/* ── 2026-10-15 视觉对齐 SPA（Ant Design 5）────────────────────
   本页原为自研浅色风格；为让「智能问答」融入统一平台（SPA 侧边栏 +
   Ant Design），把色板/字体/圆角对齐 Ant Design 5 默认 token：
   主色 #1677ff、文字 rgba(0,0,0,.88)/.45、边框 #f0f0f0/#d9d9d9。
   以下为交互态补强。 */
body{-webkit-font-smoothing:antialiased}
input:focus,select:focus{border-color:#1677ff;outline:0;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
button:hover:not(:disabled){background:#4096ff}
button:active:not(:disabled){background:#0958d9}
.card{box-shadow:0 1px 2px 0 rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px 0 rgba(0,0,0,.02)}
/* 检索知识库的复选框：原样式给 input 设了 flex:1 / padding:10px，
   会把小方框撑成一条长条，这里显式覆盖。 */
#kbpick label{display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;color:rgba(0,0,0,.88)}
#kbpick input[type=checkbox]{flex:none;width:14px;height:14px;padding:0;margin:0;border-radius:3px}
</style>
<script>
// 2026-10-15 单进程合并：统一用户表后问答接口需要 JWT。
// 这里全局包装 fetch：自动带 Authorization；401 回登录页。
(function(){
  var _fetch = window.fetch;
  window.fetch = function(input, init){
    init = init || {};
    if(!init.headers) init.headers = {};
    try{
      var t = localStorage.getItem('kb_token');
      if(t && !init.headers['Authorization']) init.headers['Authorization'] = 'Bearer ' + t;
    }catch(e){}
    return _fetch(input, init).then(function(r){
      if(r.status === 401 && location.pathname.indexOf('/login') < 0){
        location.href = '/login?from=' + encodeURIComponent(location.pathname);
      }
      return r;
    });
  };
})();
</script>
</head>
<body>
<header>
  <h1>项目管理秘书 · 模型自主问答</h1>
  <select id="model" title="选择模型"></select>
  <span id="modelnote" style="font-size:12px;color:rgba(0,0,0,.45)"></span>
  <a href="/agent/skills" style="margin-left:auto;font-size:13px;color:#1677ff;text-decoration:none">技能触发台 →</a>
</header>
<div class="wrap">
  <div>
    <div class="card" style="margin-bottom:12px">
      <p class="lbl">年度缺陷治理计划分析 —— 模拟收到一份「预算分配通知」（本期数字是模拟的，可以直接改；换供电所会重新生成）</p>
      <div class="bar" style="flex-wrap:wrap">
        <select id="rstation" title="供电所" onchange="loadNotice()"></select>
        <input id="ramount" type="number" step="0.01" title="本期分配金额（元）" style="max-width:190px" />
        <span id="rprev" style="font-size:12px;color:rgba(0,0,0,.45);line-height:34px"></span>
        <button id="rgo" onclick="runReport()">生成分析报告</button>
      </div>
      <div id="rmetrics" style="margin-top:10px"></div>
    </div>
    <!-- 检索知识库（2026-10-15 新增）：勾选本次要查的库。
         默认勾选规则见 JS loadKbs()：取库里 qa_enabled=true 的库。 -->
    <div class="bar" style="margin-bottom:8px;align-items:center;flex-wrap:wrap;gap:10px">
      <span class="lbl" style="margin:0">检索知识库：</span>
      <span id="kbpick" style="font-size:13px;display:flex;flex-wrap:wrap;gap:12px"></span>
      <span id="kbhint" style="font-size:12px;color:rgba(0,0,0,.45)"></span>
    </div>
    <div class="bar">
      <button id="pick" onclick="document.getElementById('file').click()" title="上传一个文件（Word / Excel / PDF / PPT / TXT）"
        style="background:#f4f5f7;color:#3b4653;border:1px solid #f0f0f0">📎 文件</button>
      <input id="file" type="file" style="display:none" onchange="uploadDoc(this)" />
      <input id="q" placeholder="直接说人话就行（错字、简称、漏写时间地点都能听懂），例如：环潭供电所上个月的线损率" />
      <select id="task" title="选「速读 / 审校 / 查表」时，按任务处理已上传的文件，不需要提问"
        style="padding:8px 10px;border:1px solid #f0f0f0;border-radius:8px;background:#fff;font-size:13px">
        <option value="">问答</option>
        <option value="digest">速读（要点+待办）</option>
        <option value="proofread">审校（错字/格式）</option>
        <option value="table_audit">查表（Excel）</option>
      </select>
      <button id="go" onclick="ask()">提问</button>
      <button id="newchat" onclick="newSession()" style="background:#f4f5f7;color:#3b4653;border:1px solid #f0f0f0">新会话</button>
    </div>
    <div id="filetip" style="margin-top:7px;font-size:12px;color:#8a95a1"></div>
    <div id="jobbox" style="display:none;margin-top:10px;padding:10px 12px;border:1px solid #e8eef5;border-radius:8px;background:#f8fbff">
      <div id="jobstage" style="font-size:13px;color:#3b4653"></div>
      <div style="height:6px;background:#e3ebf5;border-radius:4px;margin-top:8px;overflow:hidden">
        <div id="jobbar" style="height:100%;width:0;background:#2d7ff9;transition:width .3s"></div>
      </div>
      <div id="jobout" style="margin-top:10px;font-size:13px"></div>
    </div>
    <div id="sessbar" style="margin-top:7px;font-size:12px;color:#8a95a1"></div>
    <div style="margin-top:10px">
      <textarea id="profile" rows="2" placeholder="用户画像（可选）：例如 我是市公司运检部专责，只看全市和随县，重点看线损与工单"
        style="width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #f0f0f0;border-radius:8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Microsoft YaHei',sans-serif;font-size:13px;resize:vertical"></textarea>
    </div>
    <div class="card" style="margin-top:14px">
      <p class="lbl">回答</p>
      <div id="completed"></div>
      <div id="answer"></div>
      <div id="report"></div>
      <div id="meta"></div>
    </div>
    <div class="hint">同一场会话里会记住上一轮：这一轮没说时间、地点时会沿用上一轮（例如问完「环潭供电所上个月的线损率」，再说「那售电量呢」）。
      点「新会话」即从零开始。时间与地点由代码按今天日期算好，问题补全、查口径、取数、作答由模型自己排顺序。</div>
  </div>
  <div class="card">
    <p class="lbl">处理过程（工具调用轨迹）</p>
    <div id="trace"></div>
  </div>
</div>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var MODELNOTE={};
function loadModels(){
  fetch('/api/models').then(function(r){return r.json();}).then(function(d){
    var sel=document.getElementById('model'), groups={}, order=[];
    (d.models||[]).forEach(function(m){
      if(!groups[m.group]){groups[m.group]=[];order.push(m.group);}
      groups[m.group].push(m); MODELNOTE[m.id]=m.note||'';
    });
    order.forEach(function(g){
      var og=document.createElement('optgroup'); og.label=g;
      groups[g].forEach(function(m){
        var op=document.createElement('option'); op.value=m.id;
        op.textContent=m.label+'  ('+m.id+')';
        og.appendChild(op);
      });
      sel.appendChild(og);
    });
    sel.value=d.default||'deepseek-v4.1-flash-1017';
    document.getElementById('modelnote').textContent=MODELNOTE[sel.value]||'';
  }).catch(function(){});
}
document.getElementById('model').addEventListener('change',function(){
  document.getElementById('modelnote').textContent=MODELNOTE[this.value]||'';
});
loadModels();

/* ---------------- 检索知识库（2026-10-15 新增） ----------------
   勾选本次提问要查哪些库。默认勾选 = 库里 qa_enabled=true 的库
   （该标记在「知识库」页维护）。
   ⚠️ 默认值不用 id 写死：自增 id 会因删库/建库漂移（删了不复用、
      新建拿更大值），而标记随库走，删库自动移出、建库勾一下即可。 */
function loadKbs(){
  fetch('/api/v1/kb').then(function(r){return r.json();}).then(function(d){
    var items=(d&&d.items)||[];
    var box=document.getElementById('kbpick');
    var hint=document.getElementById('kbhint');
    if(!items.length){hint.textContent='（暂无知识库）';return;}
    box.innerHTML=items.map(function(k){
      return '<label><input type="checkbox" value="'+k.id+'"'+(k.qa_enabled?' checked':'')+'>'+esc(k.name)+'</label>';
    }).join('');
    box.addEventListener('change',updateKbHint);
    updateKbHint();
  }).catch(function(){
    document.getElementById('kbhint').textContent='（知识库列表加载失败）';
  });
}
function pickedKbIds(){
  return Array.prototype.slice.call(document.querySelectorAll('#kbpick input:checked'))
    .map(function(x){return parseInt(x.value,10);})
    .filter(function(n){return !isNaN(n);});
}
function updateKbHint(){
  var all=document.querySelectorAll('#kbpick input').length;
  var n=pickedKbIds().length;
  document.getElementById('kbhint').textContent =
    n===0 ? '⚠️ 未勾选任何库：将按系统默认范围检索' : ('已选 '+n+' / '+all+' 个');
}
loadKbs();
setSession(getSession());
function tagCls(t){return t==='kb_search'?'t-kb':(t==='run_sql'?'t-db':(t==='answer'?'t-ans':'t-meta'));}

/* ---------------- 会话（多轮记忆） ----------------
   服务端靠 session_id 记住同一场会话，并把它作为上下文交给模型。
   页面把它存在 localStorage：刷新浏览器也不丢；点「新会话」才重新开始。 */
function getSession(){
  var s=null;
  try{s=localStorage.getItem('secretary_session');}catch(e){}
  return s||'';
}
function setSession(s){
  try{localStorage.setItem('secretary_session',s||'');}catch(e){}
  var el=document.getElementById('sessbar');
  if(el){el.textContent=s?('当前会话：'+s+'（同一场会话里，本轮没说的时间和地点会沿用上一轮）'):'未开始会话，下次提问会自动新建一场';}
}
function newSession(){
  setSession('');
  document.getElementById('answer').textContent='';
  document.getElementById('completed').textContent='';
  document.getElementById('meta').textContent='';
  document.getElementById('trace').innerHTML='';
  document.getElementById('q').value='';
  document.getElementById('q').focus();
}

/* ---------------- 上传文件 / 文档任务（2026-10-19 加） ----------------
   问答：把 file_id 放进 /api/ask 的 file_ids，后端按问题取全文或节选章节；
   任务：速读 / 审校 / 查表走 /api/docs/jobs，轮询进度，完成后给下载。
   下载不能用 <a href>：鉴权是 Authorization 头（JWT 在 localStorage），
   裸链接不会带 header ⇒ 401。所以统一走 fetch → blob → 触发保存。 */
var DOCFILES=[];
function renderFiles(){
  var el=document.getElementById('filetip');
  if(!DOCFILES.length){el.textContent='';return;}
  el.innerHTML='已上传：'+DOCFILES.map(function(f){
    var p=f.parsed||{};
    return esc(f.name)+'（'+(p.ok?('已解析 '+p.chars+' 字'):('未解析：'+(p.error||'未知')))+'）';
  }).join('；');
}
function uploadDoc(inp){
  var f=inp.files&&inp.files[0]; inp.value='';
  if(!f)return;
  var tip=document.getElementById('filetip');
  tip.textContent='正在上传并解析：'+f.name+' …';
  var fd=new FormData(); fd.append('file',f);
  fetch('/api/files',{method:'POST',body:fd})
   .then(function(r){return r.json();})
   .then(function(d){
     if(d && d.file_id){ DOCFILES.push(d); renderFiles(); }
     else { tip.textContent='上传失败：'+((d&&d.detail&&d.detail.message)||JSON.stringify(d)); }
   })
   .catch(function(e){tip.textContent='上传失败：'+e;});
}
function saveBlob(url,name){
  fetch(url).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.blob();
  }).then(function(b){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=name||'download';
    document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
  }).catch(function(e){alert('下载失败：'+e);});
}
function runJob(task){
  var box=document.getElementById('jobbox');
  box.style.display='block';
  document.getElementById('jobstage').textContent='提交任务…';
  document.getElementById('jobbar').style.width='0';
  document.getElementById('jobout').innerHTML='';
  document.getElementById('answer').textContent='';
  document.getElementById('go').disabled=true;
  fetch('/api/docs/jobs',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({task:task,file_ids:DOCFILES.map(function(f){return f.file_id;})})})
   .then(function(r){return r.json();})
   .then(function(job){
     if(!job.job_id){
       document.getElementById('jobstage').textContent='提交失败：'+((job&&job.detail&&job.detail.message)||JSON.stringify(job));
       document.getElementById('go').disabled=false; return;
     }
     pollJob(job.job_id);
   })
   .catch(function(e){
     document.getElementById('jobstage').textContent='提交失败：'+e;
     document.getElementById('go').disabled=false;
   });
}
function pollJob(id){
  fetch('/api/docs/jobs/'+id).then(function(r){return r.json();}).then(function(d){
    document.getElementById('jobstage').textContent=(d.stage||'')+'  '+(d.progress||0)+'%';
    document.getElementById('jobbar').style.width=(d.progress||0)+'%';
    if(d.status==='done'){
      document.getElementById('go').disabled=false;
      document.getElementById('answer').textContent=(d.result&&d.result.answer_markdown)||'（无内容）';
      var outs=(d.outputs||[]).map(function(o){
        return '<a href="javascript:void 0" data-url="'+esc(o.url)+'" data-name="'+esc(o.name)+'"'
             + ' onclick="saveBlob(this.getAttribute(\'data-url\'),this.getAttribute(\'data-name\'))"'
             + ' style="display:inline-block;margin-right:14px">⬇ '+esc(o.name)+'</a>';
      }).join('');
      document.getElementById('jobout').innerHTML=outs||'';
      var warn=(d.result&&d.result.warnings)||[];
      if(warn.length){
        document.getElementById('jobout').innerHTML+='<div class="warn" style="margin-top:6px">'
          +warn.map(esc).join('；')+'</div>';
      }
      return;
    }
    if(d.status==='failed'||d.status==='cancelled'){
      document.getElementById('go').disabled=false;
      document.getElementById('jobstage').textContent='失败：'+(d.error||d.status);
      return;
    }
    setTimeout(function(){pollJob(id);},1500);
  }).catch(function(e){document.getElementById('jobstage').textContent='轮询失败：'+e;});
}

function ask(){
  var q=document.getElementById('q').value.trim();
  var task=document.getElementById('task').value;
  if(task){
    if(!DOCFILES.length){alert('请先点「📎 文件」上传一个文件');return;}
    runJob(task);
    return;
  }
  if(!q)return;
  var b=document.getElementById('go');b.disabled=true;b.textContent='处理中…';
  document.getElementById('answer').textContent='';
  document.getElementById('report').innerHTML='';
  document.getElementById('completed').textContent='';
  document.getElementById('trace').innerHTML='';
  document.getElementById('meta').textContent='';
  var model=document.getElementById('model').value;
  var profile=document.getElementById('profile').value.trim();
  try{localStorage.setItem('secretary_profile',profile);}catch(e){}
  fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question:q,model:model,profile:profile,
                             kb_ids:pickedKbIds(),
                             file_ids:DOCFILES.map(function(f){return f.file_id;}),
                             session_id:getSession()||undefined})})
   .then(function(r){return r.json();})
   .then(function(d){
     if(d.session_id)setSession(d.session_id);      /* 首问服务端会生成并回传 */
     document.getElementById('completed').textContent=(d.user_profile?('用户画像：'+d.user_profile+String.fromCharCode(10)):'')+(d.completed_question?('补全参考（仅参考，以问题为准）：'+d.completed_question):'');
      document.getElementById('answer').textContent=d.answer||'（空）';
     var w=d.no_db_query?'<span class="warn">本次未查询数据库</span>':'';
     var tm=d.timings||{};
     var gap=d.recorded_as_gap?'<span class="warn" style="background:#fff1f0;color:#a12a20">已记入缺口清单</span>':'';
     /* 口径：把「本轮说的」和「沿用上一轮的」区分开，避免以为是说错了 */
     var sc=d.scope||{}, scTxt='';
     if(sc.time){
       scTxt='<span class="warn" style="background:#eef4ff;color:#2d5bb9">口径：'+esc(sc.time)+' / '+esc(sc.place||'')
            +((sc.time_inherited||sc.place_inherited)?'（沿用上一轮）':'')+'</span>';
     }
     document.getElementById('meta').innerHTML='模型 '+esc(d.model||model)+' · 工具调用 '+d.steps+' 次（查库 '
        +d.db_query_count+' 次 / 知识库 '+d.kb_query_count+' 次）· 总耗时 '+(d.elapsed_ms/1000).toFixed(1)+' 秒'
         +'（补全 '+((tm.completion_ms||0)/1000).toFixed(1)+'s + 循环 '+((tm.loop_ms||0)/1000).toFixed(1)+'s）'
         +' · 会话上下文 '+(d.history_used||0)+' 轮'+w+gap+scTxt;
     var h='';
     (d.trace||[]).forEach(function(s){
       var cls=tagCls(s.tool||s.kind);
       var name=s.kind==='answer'?'最终回答':s.tool;
       var body=JSON.stringify(s.args||{},null,1)+'\n----\n'+JSON.stringify(s.result||s.content||'',null,1);
       h+='<details class="step" '+(s.kind==='answer'?'open':'')+'><summary>'
          +'<span class="tag '+cls+'">'+esc(name)+'</span>'
          +(s.round?('<span class="ms">第'+s.round+'轮</span>'):'')+'<span class="ms">'+(s.ms||s.model_ms||0)+' ms</span></summary><pre>'+esc(body)+'</pre></details>';
     });
     document.getElementById('trace').innerHTML=h;
   })
   .catch(function(e){document.getElementById('answer').textContent='请求失败：'+e;})
   .then(function(){b.disabled=false;b.textContent='提问';});
}
var NOTICE=null;
function loadReportMeta(){
  fetch('/api/report/meta').then(function(r){return r.json();}).then(function(d){
    var s=document.getElementById('rstation'); s.innerHTML='';
    (d.stations||[]).forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o);});
    if(d.stations&&d.stations.length){ s.value = d.stations.indexOf('环潭供电所')>=0 ? '环潭供电所' : d.stations[0]; }
    loadNotice();
  }).catch(function(){});
}
function loadNotice(){
  var st=document.getElementById('rstation').value;
  if(!st)return;
  document.getElementById('rmetrics').innerHTML='<p class="hint">正在按该所 2026 年真实数据生成模拟通知…</p>';
  fetch('/api/report/notice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({station:st})})
   .then(function(r){return r.json();})
   .then(function(d){
     if(d.error){document.getElementById('rmetrics').textContent='通知生成失败：'+d.error;return;}
     NOTICE=d;
     document.getElementById('ramount').value=d.cur_amount;
     document.getElementById('rprev').textContent='2026 实分 '+(d.prev_amount/10000).toFixed(2)+' 万元';
     var h='<table style="width:100%;border-collapse:collapse;font-size:12.5px">'
      +'<tr style="color:rgba(0,0,0,.45)"><th align="left">指标</th><th>方向</th><th>2026 标准分</th><th>2027 标准分（可改）</th></tr>';
     (d.metrics||[]).forEach(function(m){
       h+='<tr><td>'+esc(m.name)+'</td>'
        +'<td align="center" style="color:rgba(0,0,0,.45)">'+(m.direction==='negative'?'负向':'正向')+'</td>'
        +'<td align="center">'+m.prev_score+'</td>'
        +'<td align="center"><input class="mscore" data-key="'+esc(m.key)+'" type="number" step="0.01" min="0" max="100" value="'+m.cur_score+'" style="width:90px;padding:3px 6px"></td></tr>';
     });
     document.getElementById('rmetrics').innerHTML=h+'</table>';
   })
   .catch(function(e){document.getElementById('rmetrics').textContent='通知生成失败：'+e;});
}
function collectNotice(){
  var n={}; for(var k in (NOTICE||{})){ n[k]=NOTICE[k]; }
  n.cur_amount=parseFloat(document.getElementById('ramount').value)||0;
  var sc={};
  Array.prototype.forEach.call(document.querySelectorAll('.mscore'), function(el){ sc[el.getAttribute('data-key')]=parseFloat(el.value); });
  n.metrics=(NOTICE&&NOTICE.metrics||[]).map(function(m){ var c={}; for(var k2 in m){ c[k2]=m[k2]; } if(!isNaN(sc[m.key])){c.cur_score=sc[m.key];} return c; });
  return n;
}

function mdInline(s){
  var parts=esc(s).split('**'), out='';
  for(var i=0;i<parts.length;i++){ out += (i%2 ? '<b>'+parts[i]+'</b>' : parts[i]); }
  return out;
}
function mdToHtml(t){
  var out=[], inUl=false, inOl=false;
  function closeAll(){ if(inUl){out.push('</ul>');inUl=false;} if(inOl){out.push('</ol>');inOl=false;} }
  String(t||'').split(String.fromCharCode(10)).forEach(function(raw){
    var s=raw.trim(), i, ok=false;
    if(s.indexOf('### ')===0){closeAll();out.push('<h4>'+mdInline(s.slice(4))+'</h4>');return;}
    if(s.indexOf('## ')===0){closeAll();out.push('<h3>'+mdInline(s.slice(3))+'</h3>');return;}
    if(s.indexOf('# ')===0){closeAll();out.push('<h3>'+mdInline(s.slice(2))+'</h3>');return;}
    if(s.indexOf('- ')===0||s.indexOf('* ')===0){ if(!inUl){closeAll();out.push('<ul>');inUl=true;} out.push('<li>'+mdInline(s.slice(2))+'</li>');return;}
    if(s.length>3 && s.charCodeAt(0)>=48 && s.charCodeAt(0)<=57){
      for(i=1;i<4&&i<s.length;i++){ var ch=s.charAt(i); if(ch==='.'||ch===')'){ok=true;break;} if(s.charCodeAt(i)<48||s.charCodeAt(i)>57){break;} }
      if(ok){ if(!inOl){closeAll();out.push('<ol>');inOl=true;} out.push('<li>'+mdInline(s.slice(i+1))+'</li>');return;}
    }
    if(!s){closeAll();return;}
    closeAll(); out.push('<p>'+mdInline(s)+'</p>');
  });
  closeAll();
  return out.join('');
}
function renderReportTrace(trace, d){
  var NL=String.fromCharCode(10), h='';
  (trace||[]).forEach(function(s){
    var body, cls, name;
    if(s.kind==='tool'){
      cls = s.tool==='kb_search' ? 't-kb' : (s.tool==='run_sql' ? 't-db' : 't-meta');
      name = s.tool;
      body = JSON.stringify(s.args||{},null,1)+NL+'----'+NL+JSON.stringify(s.result||'',null,1);
    } else {
      cls='t-ans'; name='报告正文'; body=String(s.content||'');
    }
    h+='<details class="step"'+(s.kind==='answer'?' open':'')+'><summary><span class="tag '+cls+'">'+esc(name)+'</span>'
      +(s.round?('<span class="ms">第'+s.round+'轮</span>'):'')+'<span class="ms">'+(s.ms||0)+' ms</span></summary><pre>'+esc(body)+'</pre></details>';
  });
  document.getElementById('trace').innerHTML=h;
  var n=d.notice||{};
  document.getElementById('meta').innerHTML='供电所 '+esc(n.station||'')+' ｜ 2026 实分 '+(Number(n.prev_amount||0)/10000).toFixed(2)+' 万 → 2027 模拟 '+(Number(n.cur_amount||0)/10000).toFixed(2)+' 万 ｜ 模型 '+esc(d.model||'')+' ｜ 工具调用 '+(d.tool_calls||0)+' 次 ｜ 总耗时 '+((d.elapsed_ms||0)/1000).toFixed(1)+' 秒';
}
function runReport(){
  if(!NOTICE){return;}
  var b=document.getElementById('rgo'); b.disabled=true; b.textContent='分析中…约 1-2 分钟';
  document.getElementById('answer').textContent='';
  document.getElementById('completed').textContent='';
  document.getElementById('trace').innerHTML='';
  document.getElementById('meta').innerHTML='';
  document.getElementById('report').innerHTML='<p class="hint">模型正在按技能文档自己查数、写报告，约 1-2 分钟…</p>';
  fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({notice:collectNotice(),model:document.getElementById('model').value})})
   .then(function(r){return r.json();})
   .then(function(d){
     document.getElementById('report').innerHTML=mdToHtml(d.report||'（模型未返回内容）');
     renderReportTrace(d.trace||[],d);
   })
   .catch(function(e){document.getElementById('report').textContent='请求失败：'+e;})
   .then(function(){b.disabled=false;b.textContent='生成分析报告';});
}
