# ══════════════════════════════════════════════════════════════
#  统一后端 nginx 站点配置（2026-10-15 单进程合并后）
#  放置位置：宿主机 /etc/nginx/conf.d/kb.conf
#  （本文件是"模板"，部署时拷到宿主机 nginx 目录）
#
#  ★ 合并后的形态：后端已自带 SPA 托管（app/main.py 挂载 web/dist），
#    所以 nginx **不需要**再托管静态文件——整站反代到 8200 一个端口即可：
#      /            → 前端 SPA（知识库管理界面）
#      /api/v1/*    → 知识库 API
#      /api/*       → 问数智能体 API
#      /agent/*     → 智能问答 / 语音 / 技能台三个页面
#      /health      → 健康检查（含词典/知识库/模型通道状态）
#
#  ⚠️ 用【独立域名】是关键：现网已有 `location /api/ → 127.0.0.1:11999`，
#     若混在同一 server 块会被截胡。独立域名 = 保险。
# ══════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name kb.example.com;        # ← 改成你的域名

    # 上传上限，与后端 MAX_UPLOAD_MB 对齐（默认 100MB）
    client_max_body_size 100m;

    # ── 全站反代到统一后端 8200 ─────────────────────────────
    # 前端已由后端托管（web/dist），因此这里只做一层纯反代，
    # 不再有 nginx 自己的 root —— 避免"前端一份、后端挂一份"的路径不一致。
    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 文档上传（解析→切片→向量化）与问数查询耗时较长，放宽超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 问数智能体的流式输出必须关闭缓冲，否则前端拿不到增量
        proxy_buffering off;
        proxy_cache off;
    }

    # ── 健康检查（可选；给监控探活用）──────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:8200/health;
        access_log off;
    }
}

# ══════════════════════════════════════════════════════════════
#  HTTPS（可选）：服务器能出网时，直接用 certbot 自动改本文件：
#      certbot --nginx -d kb.example.com
#  不能出网则手工贴证书，并在 server_name 前加 443 ssl 配置。
# ══════════════════════════════════════════════════════════════