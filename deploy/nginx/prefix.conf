# ══════════════════════════════════════════════════════════════
#  带前缀站点模板（2026-11-19）
#  用法：deploy.sh 里 SITE_PREFIX=sandbox 时，这段被追加到 NGINX_CONF 末尾，
#        模板里的 __PREFIX__ / __PORT__ 由脚本替换。
#
#  三条硬要求（SRS-02 IF-NGINX-001/002）：
#    ① location 用 `^~` —— 否则会被 `location ~* \.(js|css)$` 这类正则抢走，
#       静态资源落到后端 catch-all，返回 index.html（application/javascript 变成
#       text/html），浏览器按 JS 解析直接白屏。
#    ② proxy_pass 结尾**必须带斜杠** —— nginx 才会剥掉 `/sandbox` 前缀。
#    ③ 前端与接口在同一前缀下可达 —— 本段是一个整块反代，天然满足。
#
#  ⚠️ 一个站点一个主机名（SRS-02 IF-DNS-001）：两个实例共用主机名+端口时，
#     浏览器把它们当同一 origin，localStorage 里的 token 会互相覆盖、
#     后登的把先登的踢下线。要真正互不影响，给每个实例配独立主机名。
# ══════════════════════════════════════════════════════════════

location ^~ /__PREFIX__/ {
    proxy_pass http://127.0.0.1:__PORT__/;      # ← 结尾的斜杠就是「剥前缀」
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 上传/入库/问数都慢，超时与根路径站点保持一致
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 流式输出必须关缓冲
    proxy_buffering off;
    proxy_cache off;

    # 系统账号（X-Internal-Token）只在服务端之间用，不经公网入口
    proxy_set_header X-Internal-Token "";
}

# 不带结尾斜杠的访问（/__PREFIX__）补一次跳转，否则相对路径会算到上一层
location = /__PREFIX__ {
    return 301 /__PREFIX__/;
}
