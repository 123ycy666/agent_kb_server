dispatch:
  ADMIN_ROLE: admin
  CATEGORY_NAMES:
    budget: 预算预警
    metric: 指标预警
    project: 项目全过程管理预警
    review: 穿透式复盘预警
  DUTY_CHAIN:
    budget:
      sgscwb:
      - master
      sz:
      - xgscwb
      xgscwb:
      - sgscwb
    metric:
      cto:
      - sgscwb
      sgscwb:
      - master
      sz:
      - cto
      - yxb
      xgscwb:
      - sgscwb
      yxb:
      - sgscwb
    project:
      cto:
      - sgscwb
      sgscwb:
      - master
      sz:
      - cto
      - xgscwb
      xgscwb:
      - sgscwb
      yxb:
      - sgscwb
    review:
      sgscwb:
      - master
      sz:
      - xgscwb
      xgscwb:
      - sgscwb
  LEVEL_GRACE_DAYS:
    high: 1
    low: 2
    mid: 1
  LEVEL_REPLY_HOURS:
    high: 24
    low: 168
    mid: 72
  LEVEL_TARGET_DAYS:
    high: 30
    low: 30
    mid: 30
  LOSS_RATE_MAX: 3.0
  MASTER_ESCALATION_BLOCK: true
  METRIC_ROLE:
    averageOutageDuration: cto
    faultRepairWorkOrder: cto
    feedbackWorkOrder: yxb
    lossRate: cto
    salesVolume: yxb
    tripCount: cto
  NODE_ROLE:
    供电所内部审核: sz
    县公司财务部审核: xgscwb
    县公司运检部审核: cto
    市公司财务部审核: sgscwb
    市公司领导审批: master
    营销部审核: yxb
  NOT_REVIEWED_DAYS: 90
  OVERRUN_RATIO: 1.0
  ROI_MIN: 0.1
  ROI_MIN_INVEST: 1000000.0
  ROLE_CATEGORIES:
    codea: []
    cto:
    - project
    - metric
    master:
    - budget
    - review
    - metric
    sgscwb:
    - budget
    - project
    - review
    - metric
    sz:
    - budget
    - project
    - review
    xgscwb:
    - budget
    - project
    - review
    - metric
    yxb:
    - project
    - metric
  STAY_BACKLOG_DAYS: 90
  STAY_SLOW_DAYS: 15
  SUBTYPES:
    budget.overrun:
      cadence: daily
      closure: auto
      enabled: true
      level: high
      name: 预算超支风险
      note: 已审批 > 分配；当前实测 0 命中，留作守门判据
      object: station
      reply_h: 24
      roles:
      - sz
      - xgscwb
      - sgscwb
      - master
      target_d: 30
    budget.underspend:
      cadence: daily
      closure: auto
      enabled: true
      level: high
      name: 预算花不完
      note: 按当前审批速度外推到年底 < 分配×60% 才发；花得完不发
      object: station
      reply_h: 24
      roles:
      - sz
      - xgscwb
      - sgscwb
      - master
      target_d: 30
    metric.deteriorated:
      cadence: monthly
      closure: auto
      enabled: true
      level: mid
      name: 指标同比恶化
      note: 排除售电量（累计口径没对齐=假恶化）；只推跳闸与线损
      object: metric
      reply_h: 168
      roles:
      - xgscwb
      - cto
      - yxb
      - sgscwb
      - master
      target_d: 30
    metric.stale:
      cadence: monthly
      closure: auto
      enabled: false
      level: low
      name: 指标数据过期
      note: 默认关：数据治理项，进周报即可，不占每日待办
      object: metric
      reply_h: 168
      roles:
      - sgscwb
      target_d: 30
    metric.threshold:
      cadence: monthly
      closure: auto
      enabled: true
      level: mid
      name: 指标越阈值
      note: 线损率 >3%（优秀线）；其他指标缺业务目标值，先不做
      object: metric
      reply_h: 168
      roles:
      - sz
      - xgscwb
      - cto
      - sgscwb
      target_d: 30
    project.acceptance_overdue:
      cadence: daily
      closure: auto
      enabled: false
      level: mid
      name: 完工未上报
      note: 默认关：状态历史表 2026 年状态7 无记录，update_time 是同日批量写，判"进入状态时间"不可靠
      object: station
      reply_h: 72
      roles:
      - sz
      target_d: 30
    project.amount_structure:
      cadence: weekly
      closure: auto
      enabled: false
      level: low
      name: 申报金额存疑
      note: 默认关：24 单常驻，每天推同一句；先放进"提交前自检"，不做每日预警
      object: station
      reply_h: 168
      roles:
      - sz
      - xgscwb
      target_d: 7
    project.approval_stay:
      cadence: daily
      closure: auto
      enabled: true
      level: high
      name: 审批停留超期
      note: 只算本角色对应节点；>90 天=积压(高)，16~90 天=偏慢(中)
      object: node
      reply_h: 24
      roles:
      - sz
      - cto
      - yxb
      - xgscwb
      - sgscwb
      - master
      target_d: 7
    project.approved_not_started:
      cadence: daily
      closure: auto
      enabled: true
      level: mid
      name: 已批未开工
      note: 状态3 且审批完成 >30 天；无审批完成时间时用 update_time 并在 data 标注
      object: station
      reply_h: 72
      roles:
      - sz
      target_d: 30
    project.exec_stalled:
      cadence: daily
      closure: auto
      enabled: true
      level: high
      name: 施工停滞
      note: 状态6 且停留 >90 天；2026 年 0 单，判据保留给存量
      object: station
      reply_h: 72
      roles:
      - sz
      target_d: 30
    review.low_roi:
      cadence: yearly
      closure: human
      enabled: true
      level: mid
      name: 投入产出偏低
      note: 按行取治理成效表，**不 SUM**（表内含全市行，求和会翻倍）
      object: org
      reply_h: 168
      roles:
      - xgscwb
      - sgscwb
      - master
      target_d: 90
    review.no_effect:
      cadence: yearly
      closure: human
      enabled: false
      level: mid
      name: 投入未见效
      note: 默认关：2026 年产出全空、2024 年投入全空，跨年对比无法成立；等业务补数据
      object: org
      reply_h: 168
      roles:
      - xgscwb
      - sgscwb
      - master
      target_d: 90
    review.not_reviewed:
      cadence: monthly
      closure: human
      enabled: true
      level: low
      name: 完工未复盘
      note: 完工 >90 天且无复盘任务；进入状态时间按 update_time 估算，data 里标 estimated
      object: station
      reply_h: 168
      roles:
      - sz
      target_d: 30
  TITLE_MAX: 44
  URGE_BEFORE_HOURS: 4
  URGE_MIN_INTERVAL_H: 24
