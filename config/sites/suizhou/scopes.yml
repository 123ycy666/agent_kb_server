# 部门口径（随州）—— 2026-10-21 从 alert_scope.py 外置
# 换成仙桃时改这里：city_dept_id 一定不同（别照抄 1），county_roles 按本单位角色码填。
department:
  # 市级口径的锚点部门 ID：这个 ID 的部门 = 全市，其子部门 = 各供电所
  city_dept_id: 1
  city_label: 随州市供电所

  # 县级角色：部门只映射到本所一个时，要上溯父部门（否则县级账号只能看 1 个所）
  # 反例：录入人员（codea）挂某个所时不该上溯 —— 所以只列县级角色
  county_roles:
    - cto
    - yxb
    - xgscwb
  # 市级口径在数据里的写法（alerts 判断"这条指标算不算全市"用）
  city_names:
    - 随州市
    - 全市
  # 县公司清单（派单按范围名落到部门用）：label 是回答里显示的名字
  county_depts:
    - {key: 曾都, dept_id: 10, role: xgscwb, label: 曾都区供电公司}
    - {key: 随县, dept_id: 11, role: xgscwb, label: 随县供电公司}
    - {key: 高新, dept_id: 12, role: xgscwb, label: 高新供电公司}
    - {key: 广水, dept_id: 13, role: xgscwb, label: 广水供电公司}
