# 模式判定关键词（E4：改这里就换判定口径，代码不用动）
# 匹配优先级：produce+objects > data > kb > chat > 落 general
# 换单位时若叫法不同（例如"供电所"叫"服务中心"），只改这个文件。

produce:      # 动词：出现它 + 下面的产物词 → office
  - 做
  - 写
  - 生成
  - 出一份
  - 出个
  - 整理成
  - 转成
  - 导出
  - 起草
  - 拟一份
  - 汇总成

# 产物词分两类（2026-10-21 调）：
#   objects_file —— 要"文件/交付物"（PPT、Word 文档、表格）→ office（技能包干活）
#   objects_text —— 只是"写段文字"（总结、作文、通知、讲稿）→ general（直接写，不查库）
# 判"写东西"时：含问数词 → data（先查再写）；不含 → general（纯写作）
objects_file:
  - ppt
  - 幻灯片
  - 演示
  - 汇报材料
  - 文档
  - 公文
  - 简报
  - 请示
  - 表格
  - 台账
  - 清单
  - 模板
  - 方案

objects_text:
  - 总结
  - 作文
  - 文案
  - 讲稿
  - 邮件
  - 通知
  - 说明
  - 心得体会
  - 材料
  - 报告
  - 纪事
  - 稿子

business_topics:   # 业务主题词：写材料时命中它 → 必须 data（先查再写），否则会编造业务情况
  - 配网
  - 台区
  - 线路
  - 线损
  - 工单
  - 缺陷
  - 预算
  - 项目
  - 审批
  - 指标
  - 抢修
  - 停电
  - 售电
  - 供电所
  - 执行率
  - 进度

data:         # 问数词 → data
  - 多少
  - 多大
  - 几个
  - 几笔
  - 几条
  - 占比
  - 比例
  - 排名
  - 前几
  - 同比
  - 环比
  - 哪几个
  - 哪些
  - 统计
  - 合计
  - 总额
  - 总数
  - 平均
  - 执行率
  - 完成率
  - 差多少

kb:           # 制度/流程词 → data（走知识库检索）
  - 规定
  - 流程
  - 制度
  - 办法
  - 标准
  - 怎么规定
  - 谁审批
  - 依据

chat:         # 寒暄 → general 直答
  - 你好
  - 您好
  - hi
  - hello
  - 在吗
  - 谢谢
  - 你是谁
  - 你能干什么
